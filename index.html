<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Damvolt Engineering Services Private Limited</title>
    <meta
      name="description"
      content="Damvolt Engineering Services Private Limited — complete electrical & automation solutions: transformers, LT/HT panels, industrial cables, testing, commissioning, PLC/VFD automation. Noida & New Delhi."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="Damvolt" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Damvolt Engineering Services Private Limited" />
    <meta property="og:description" content="Complete electrical & automation solutions — efficient and safe." />
    <meta property="og:site_name" content="Damvolt Engineering Services Private Limited" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Damvolt logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <link rel="icon" type="image/png" href="/fav.png" />
    <link rel="apple-touch-icon" href="/fav-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/loader.svg" fetchpriority="high" />
    <style>
      /* Preloader styles inline so it shows before the CSS bundle loads */
      #preloader { position: fixed; inset: 0; z-index: 9999; background: #fff; display: grid; place-items: center; transition: opacity .3s ease-out, visibility 0s linear .3s; }
      #preloader.done { opacity: 0; visibility: hidden; }
      /* The animated logo (/loader.svg) is a fixed file — it does not change with the admin panel */
      #preloader img { width: min(46vw, 220px); height: auto; aspect-ratio: 1; }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <img src="/loader.svg" alt="" width="220" height="220" fetchpriority="high" />
    </div>
    <script>
      window.__plStart = performance.now()
      // Ask the server for the page content right now, in parallel with downloading the app code (saves ~1 s).
      ;(function () {
        var u = '%VITE_API_URL%'
        if (u.charAt(0) === '%') u = '/api'
        var p = fetch(u.replace(/\/$/, '') + '/content', { headers: { Accept: 'application/json' }, cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error('API ' + r.status)
          return r.json()
        })
        p.catch(function () {})
        window.__content = p
        // Returning visitor: start downloading the banner picture seen last time before any code has run.
        try {
          var hero = localStorage.getItem('damvolt:hero')
          if (hero) {
            var l = document.createElement('link')
            l.rel = 'preload'
            l.as = 'image'
            l.href = hero
            l.setAttribute('fetchpriority', 'high')
            document.head.appendChild(l)
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
