<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Damvolt Engineering Services Private Limited</title>
    <meta
      name="description"
      content="Damvolt Engineering Services Private Limited — complete electrical & automation solutions: transformers, LT/HT panels, industrial cables, testing, commissioning, PLC/VFD automation. Noida & New Delhi."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="Damvolt" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Damvolt Engineering Services Private Limited" />
    <meta property="og:description" content="Complete electrical & automation solutions — efficient and safe." />
    <meta property="og:image" content="/images/hero-powerlines.webp" />
    <link rel="icon" type="image/png" href="/fav.png" />
    <link rel="apple-touch-icon" href="/fav.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint, so the preloader appears instantly -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Cinzel:wght@600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Cinzel:wght@600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Cinzel:wght@600&display=swap" />
    </noscript>
    <style>
      /* Preloader styles inline so it shows before the CSS bundle loads */
      #preloader { position: fixed; inset: 0; z-index: 9999; background: #fff; display: grid; place-items: center; transition: opacity .8s cubic-bezier(.4,0,.2,1), visibility 0s linear .8s; }
      #preloader.done { opacity: 0; visibility: hidden; }
      .pl-inner { display: flex; flex-direction: column; align-items: center; gap: 26px; animation: plIn .7s cubic-bezier(.22,1,.36,1) both; transition: transform .8s cubic-bezier(.4,0,.2,1), opacity .6s ease; }
      #preloader.done .pl-inner { animation: none; transform: scale(1.06); opacity: 0; }
      .pl-inner img { width: 68px; height: 68px; animation: plBreathe 2.6s ease-in-out infinite; }
      .pl-bar { width: 160px; height: 3px; background: #e3edfb; border-radius: 3px; overflow: hidden; }
      /* Fills smoothly towards 85% while loading, then completes to 100% once the page is ready */
      .pl-bar span { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #2078fe, #4dc9ff); border-radius: 3px; transform-origin: left; transform: scaleX(0); animation: plFill 2.4s cubic-bezier(.25,.8,.3,1) forwards; }
      @keyframes plIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes plBreathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.95); opacity: .82; } }
      @keyframes plFill { from { transform: scaleX(0); } to { transform: scaleX(.85); } }
      @media (prefers-reduced-motion: reduce) { .pl-inner, .pl-inner img, .pl-bar span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="pl-inner">
        <img src="/fav.png" alt="" />
        <div class="pl-bar"><span></span></div>
      </div>
    </div>
    <script>window.__plStart = performance.now()</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
